name: EPA official behavior probes batch 4

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/epa-official-behavior-probes-batch4.yml"
      - "tools/run_v26135_official_behavior_probe_batch.py"
      - "tools/extract_v26135_source_pattern_evidence.py"
      - "reference/probes/v26135/batch4/manifest.json"
      - "reference/probes/v26135/batch4/source-searches.json"
      - "reference/probes/v26135/batch4/platform-cases.json"
      - "reference/probes/v26135/batch4/background-cases.json"
      - "reference/probes/v26135/batch4/grid-cases.json"
      - "reference/probes/v26135/batch4/discrete-cases.json"
      - "reference/probes/v26135/batch4/discpolr-cases.json"
      - "tests/test_behavior_probe_batch4_manifest.py"

permissions:
  actions: read
  contents: read

jobs:
  parser-shaping-batch-4:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download retained official fixture snapshot
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/8701857473/zip"
          Invoke-WebRequest -Uri $uri -Headers $headers -OutFile fixtures.zip
          Expand-Archive fixtures.zip -DestinationPath fixtures-snapshot

      - name: Download official EPA v26135 assets
        shell: pwsh
        run: |
          $base = "https://gaftp.epa.gov/Air/aqmg/SCRAM/models/preferred/aermod"
          Invoke-WebRequest -Uri "$base/aermod_exe.zip" -OutFile aermod-exe.zip
          Invoke-WebRequest -Uri "$base/aermod_source.zip" -OutFile aermod-source.zip
          Expand-Archive aermod-exe.zip -DestinationPath official-executable
          Expand-Archive aermod-source.zip -DestinationPath official-source
          $exe = Get-ChildItem official-executable -Recurse -Filter aermod.exe |
            Select-Object -First 1
          if (-not $exe) {
            throw "The official executable archive did not contain aermod.exe"
          }
          "AERMOD_EXE=$($exe.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Retain exact official source diagnostic contexts
        shell: pwsh
        run: |
          python tools/extract_v26135_source_pattern_evidence.py `
            --source-root official-source `
            --config reference/probes/v26135/batch4/source-searches.json `
            --output "$env:RUNNER_TEMP/aermod-v26135-behavior-probes-batch4/source-pattern-evidence.json"

      - name: Compose reviewed batch manifest
        shell: pwsh
        run: |
          python tools/merge_v26135_behavior_probe_manifests.py `
            --base reference/probes/v26135/batch4/manifest.json `
            --fragment reference/probes/v26135/batch4/platform-cases.json `
            --fragment reference/probes/v26135/batch4/background-cases.json `
            --fragment reference/probes/v26135/batch4/grid-cases.json `
            --fragment reference/probes/v26135/batch4/discrete-cases.json `
            --fragment reference/probes/v26135/batch4/discpolr-cases.json `
            --output "$env:RUNNER_TEMP/aermod-v26135-behavior-probes-batch4-manifest.json"

      - name: Run focused official behavior probes
        shell: pwsh
        run: |
          python tools/run_v26135_official_behavior_probe_batch.py `
            --fixtures fixtures-snapshot/fixtures `
            --executable "$env:AERMOD_EXE" `
            --source-root official-source `
            --source-archive aermod-source.zip `
            --manifest "$env:RUNNER_TEMP/aermod-v26135-behavior-probes-batch4-manifest.json" `
            --output "$env:RUNNER_TEMP/aermod-v26135-behavior-probes-batch4" `
            --git-sha "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Write probe summary
        if: always()
        shell: pwsh
        run: |
          $path = "$env:RUNNER_TEMP/aermod-v26135-behavior-probes-batch4/batch-summary.json"
          if (-not (Test-Path $path)) {
            "Probe summary was not generated." | Out-File $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          $report = Get-Content $path -Raw | ConvertFrom-Json
          "# AERMOD v26135 behavior probes batch 4" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- executable SHA-256: ``$($report.official_assets.executable_sha256)``" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- executable hash matches retained evidence: $($report.official_assets.executable_hash_matches_expected)" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- cases accepted/rejected/indeterminate: $($report.totals.cases.accepted)/$($report.totals.cases.rejected)/$($report.totals.cases.indeterminate)" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| Case | Observed | Diagnostics |" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append
          "|---|---|---|" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          foreach ($item in $report.cases) {
            $codes = ($item.diagnostic_codes -join ", ")
            "| $($item.id) | $($item.observed_outcome) | $codes |" |
              Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload retained probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aermod-v26135-official-behavior-probes-batch4-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/aermod-v26135-behavior-probes-batch4
          if-no-files-found: error
          retention-days: 30
