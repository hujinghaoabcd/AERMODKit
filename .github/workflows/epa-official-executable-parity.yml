name: EPA official executable parity

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  capped-parity:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download retained current fixtures
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/8701857473/zip"
          Invoke-WebRequest -Uri $uri -Headers $headers -OutFile fixtures.zip
          Expand-Archive fixtures.zip -DestinationPath fixtures-snapshot

      - name: Download official EPA executable
        shell: pwsh
        run: |
          $uri = "https://gaftp.epa.gov/Air/aqmg/SCRAM/models/preferred/aermod/aermod_exe.zip"
          Invoke-WebRequest -Uri $uri -OutFile aermod-exe.zip
          Get-FileHash aermod-exe.zip -Algorithm SHA256 |
            Format-List |
            Out-File aermod-exe-sha256.txt
          Expand-Archive aermod-exe.zip -DestinationPath official-executable
          $exe = Get-ChildItem official-executable -Recurse -Filter aermod.exe |
            Select-Object -First 1
          if (-not $exe) {
            throw "The EPA executable archive did not contain aermod.exe"
          }
          "AERMOD_EXE=$($exe.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Probe capped-source parity
        shell: pwsh
        run: |
          python tools/probe_official_aermod_executable.py `
            --fixtures fixtures-snapshot/fixtures `
            --executable "$env:AERMOD_EXE" `
            --output "$env:RUNNER_TEMP/aermod-official-executable-parity" `
            --case capped `
            --case capped_nostd
          Copy-Item aermod-exe-sha256.txt `
            "$env:RUNNER_TEMP/aermod-official-executable-parity/"

      - name: Write parity summary
        shell: pwsh
        run: |
          $report = Get-Content `
            "$env:RUNNER_TEMP/aermod-official-executable-parity/official-executable-parity.json" `
            -Raw | ConvertFrom-Json
          foreach ($case in $report.cases) {
            $comparison = $case.comparison
            "## $($case.case)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "- return code: $($case.returncode)" |
              Out-File $env:GITHUB_STEP_SUMMARY -Append
            "- canonical diff lines: $($comparison.canonical_diff_lines)" |
              Out-File $env:GITHUB_STEP_SUMMARY -Append
            "- maximum relative difference: $($comparison.metric_max_rel)" |
              Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: aermod-v26135-official-executable-parity-${{ github.sha }}
          path: ${{ runner.temp }}/aermod-official-executable-parity
          if-no-files-found: error
          retention-days: 14
