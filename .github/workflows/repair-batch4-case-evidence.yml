name: Repair batch 4 case evidence

on:
  pull_request:
    paths:
      - ".github/workflows/repair-batch4-case-evidence.yml"

permissions:
  actions: read
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Download reviewed Batch 4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o reviewed.zip \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/8735323902/zip"
          unzip -q reviewed.zip -d reviewed
      - name: Regenerate exact case CSV
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          from pathlib import Path

          summary = json.loads(Path("reviewed/batch-summary.json").read_text())
          rows = []
          for case in summary["cases"]:
              identifier = case["id"]
              deck = next(
                  item for item in case["files"]
                  if item["path"] == f"inputs/{identifier}.inp"
              )
              main = next(
                  item for item in case["files"]
                  if item["path"] == f"Outputs/{identifier}.out"
              )
              generated = []
              for item in case["files"]:
                  path = item["path"]
                  if (
                      path.startswith("Outputs/")
                      and path != f"Outputs/{identifier}.out"
                      and "ERROR" not in path.upper()
                  ):
                      generated.extend([path, str(item["size"]), item["sha256"]])
              rows.append({
                  "case_id": identifier,
                  "outcome": case["observed_outcome"],
                  "diagnostic_codes": ",".join(case["diagnostic_codes"]),
                  "deck_sha256": deck["sha256"],
                  "main_output_sha256": main["sha256"],
                  "generated_outputs": "|".join(generated),
              })

          stream = io.StringIO(newline="")
          writer = csv.DictWriter(
              stream,
              fieldnames=[
                  "case_id", "outcome", "diagnostic_codes", "deck_sha256",
                  "main_output_sha256", "generated_outputs",
              ],
              lineterminator="\n",
          )
          writer.writeheader()
          writer.writerows(rows)
          data = stream.getvalue().encode()
          digest = hashlib.sha256(data).hexdigest()
          expected = "fb57a318743f50689720a9498598e7df5f99b3e66c6322593f1c09c55c7a0f91"
          if digest != expected:
              raise SystemExit(f"case evidence hash mismatch: {digest}")
          Path("reference/probes/v26135/batch4/case-evidence.csv").write_bytes(data)
          PY
      - name: Commit repaired evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/probes/v26135/batch4/case-evidence.csv
          git commit -m "Regenerate reviewed Batch 4 case evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
