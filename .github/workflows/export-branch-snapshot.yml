name: Export branch snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/export-branch-snapshot.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: aermodkit-batch4-working-tree-${{ github.event.pull_request.head.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
