name: EPA current test fixtures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download current official regression fixtures
        run: >-
          python tools/snapshot_epa_current_test_fixtures.py
          --output "${{ runner.temp }}/aermod-v26135-current-test-fixtures"
      - name: Upload current official regression fixtures
        uses: actions/upload-artifact@v4
        with:
          name: aermod-v26135-current-test-fixtures-${{ github.sha }}
          path: ${{ runner.temp }}/aermod-v26135-current-test-fixtures
          if-no-files-found: error
          retention-days: 14
