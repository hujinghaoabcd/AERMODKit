name: Apply CO completion stage

on:
  push:
    branches:
      - agent/bootstrap-project-foundation
    paths:
      - '.co_complete_stage/**'
      - '.github/workflows/apply-co-complete-stage.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct and verify payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import shutil
          import tarfile

          stage = Path('.co_complete_stage')
          encoded = ''.join(path.read_text() for path in sorted(stage.glob('chunk_*.txt')))
          payload = base64.b64decode(encoded, validate=True)
          expected_tar = '1a3ae9a7d6b62fb5550ef51829cecd79ad543c0e23e277700dc0d4260f13af89'
          actual_tar = hashlib.sha256(payload).hexdigest()
          if actual_tar != expected_tar:
              raise SystemExit(f'payload SHA256 mismatch: {actual_tar}')

          archive = stage / 'payload.tar.gz'
          archive.write_bytes(payload)
          with tarfile.open(archive, 'r:gz') as handle:
              for member in handle.getmembers():
                  target = Path(member.name)
                  if target.is_absolute() or '..' in target.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
              handle.extractall('.')

          manifest_path = Path('_co_complete_manifest.json')
          manifest = json.loads(manifest_path.read_text())
          for relative, expected in manifest.items():
              path = Path(relative)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'file SHA256 mismatch: {relative}: {actual}')

          manifest_path.unlink()
          shutil.rmtree(stage)
          Path('.github/workflows/apply-co-complete-stage.yml').unlink()
          PY
      - name: Validate reconstructed package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check .
          mypy src
          pytest --cov=aermodkit --cov-report=term-missing
      - name: Commit verified files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete source-verified CO pathway specification'
          git push origin HEAD:${{ github.ref_name }}
