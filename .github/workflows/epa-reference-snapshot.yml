name: EPA reference snapshot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/epa-reference-snapshot.yml
      - tools/snapshot_epa_reference_assets.py

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        asset:
          - aermod-source
          - sample-run
          - test-cases

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and inventory EPA archive
        run: >-
          python tools/snapshot_epa_reference_assets.py
          --asset "${{ matrix.asset }}"
          --output "${{ runner.temp }}/aermod-v26135-${{ matrix.asset }}"
      - name: Upload compact reference snapshot
        uses: actions/upload-artifact@v4
        with:
          name: aermod-v26135-${{ matrix.asset }}-${{ github.sha }}
          path: ${{ runner.temp }}/aermod-v26135-${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14
