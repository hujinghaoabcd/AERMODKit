name: Apply batch 4 spec evidence

on:
  pull_request:
    paths:
      - ".github/workflows/apply-batch4-spec-evidence.yml"
      - "tools/apply_v26135_batch4_spec_evidence.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore authoritative fragments from main
        run: |
          git fetch origin main
          git checkout origin/main -- \
            src/aermodkit/spec/versions/v26135/so_geometry_platform_building.json \
            src/aermodkit/spec/versions/v26135/so_chemistry_background.json \
            src/aermodkit/spec/versions/v26135/re_grids.json \
            src/aermodkit/spec/versions/v26135/re_discrete_include_finish.json
      - name: Apply reviewed evidence
        run: python tools/apply_v26135_batch4_spec_evidence.py
      - name: Validate JSON and pathway loader
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_so_re_pathway_specification.py tests/test_pathway_specification.py
      - name: Commit generated fragments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/aermodkit/spec/versions/v26135/so_geometry_platform_building.json \
            src/aermodkit/spec/versions/v26135/so_chemistry_background.json \
            src/aermodkit/spec/versions/v26135/re_grids.json \
            src/aermodkit/spec/versions/v26135/re_discrete_include_finish.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Apply reviewed Batch 4 record evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
